
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday 🌷</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="hearts" id="hearts"></div>

    <main class="container">

        <section class="intro" id="intro">
            <div class="flower">🌷</div>
            <h1>Happy Birthday!</h1>
            <p>Mình có một món quà nhỏ dành cho bạn...</p>

            <div class="envelope" id="envelope">
                💌
            </div>

            <button id="openBtn">Mở món quà 🎁</button>
        </section>

        <section class="birthday hidden" id="birthday">
            <h1>Happy Birthday! 🎂</h1>

            <div class="cake">🎂</div>

            <h2>Chúc mừng sinh nhật!</h2>

            <p class="message" id="message"></p>

            <div class="gallery">
                <img src="images/capy1.jpg" alt="Kỷ niệm 1">
                <img src="images/capy2.jpg" alt="Kỷ niệm 2">
                <img src="images/capy3.jpg" alt="Kỷ niệm 3">
            </div>

            <p class="footer">
                Chúc bạn có một ngày sinh nhật thật tuyệt vời! 💗
            </p>

            <button id="againBtn">Xem lại thiệp 💌</button>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
